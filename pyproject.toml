[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecommerce_store_backend"
version = "0.1.0"
description = "E-commerce store FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.17.0",
  "annotated-types==0.7.0",
  "anyio==4.11.0",
  "argon2-cffi==23.1.0",
  "argon2-cffi-bindings==25.1.0",
  "boto3==1.40.53",
  "botocore==1.40.53",
  "certifi==2025.10.5",
  "cffi==2.0.0",
  "charset-normalizer==3.4.4",
  "click==8.3.0",
  "cryptography==46.0.3",
  "Deprecated==1.3.1",
  "dnspython==2.8.0",
  "ecdsa==0.19.1",
  "email-validator==2.3.0",
  "exceptiongroup==1.3.0",
  "fastapi==0.119.0",
  "greenlet==3.2.4",
  "h11==0.16.0",
  "httptools==0.7.1",
  "idna==3.11",
  "jmespath==1.0.1",
  "limits==5.8.0",
  "Mako==1.3.10",
  "MarkupSafe==3.0.3",
  "packaging==26.2",
  "passlib==1.7.4",
  "psycopg2-binary==2.9.11",
  "pyasn1==0.6.1",
  "pycparser==2.23",
  "pydantic==2.12.2",
  "pydantic-settings==2.11.0",
  "pydantic_core==2.41.4",
  "python-dateutil==2.9.0.post0",
  "python-decouple==3.8",
  "python-dotenv==1.1.1",
  "python-jose==3.5.0",
  "python-multipart==0.0.20",
  "PyYAML==6.0.3",
  "requests==2.32.5",
  "resend==2.17.0",
  "rsa==4.9.1",
  "s3transfer==0.14.0",
  "six==1.17.0",
  "slowapi==0.1.9",
  "sniffio==1.3.1",
  "SQLAlchemy==2.0.44",
  "starlette==0.48.0",
  "tomli==2.3.0",
  "typing-inspection==0.4.2",
  "typing_extensions==4.15.0",
  "urllib3==2.5.0",
  "uvicorn==0.37.0",
  "uvloop==0.21.0",
  "watchfiles==1.1.1",
  "websockets==15.0.1",
  "wrapt==2.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "pytest-cov==5.0.0",
  "httpx==0.27.2",
  "factory-boy==3.3.1",
  "faker==30.8.1",
  "freezegun==1.5.1",
  "respx==0.21.1",
  "ruff==0.7.4",
  "pyright==1.1.389",
  "pre-commit==4.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
# `D` (pydocstyle) deferred until a docstring convention is decided.

[tool.ruff.lint.per-file-ignores]
# Tests: `assert`, hardcoded password strings/defaults are idiomatic fixture data.
"tests/**" = ["S101", "S105", "S106", "S107"]
# Auto-generated migrations.
"alembic/versions/**" = ["ALL"]
# HTML email templates: breaking long lines mid-attribute hurts readability.
"app/core/email.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = false

[tool.ruff.lint.flake8-bugbear]
# FastAPI Depends() / Query() / Body() / Path() / Header() / Cookie() / File() / Form()
# are the canonical "mutable default" pattern in route signatures — not bugs.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Body",
  "fastapi.Path",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.File",
  "fastapi.Form",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["app", "tests"]
# `tests/legacy/` is the pre-pytest standalone-script directory (also in
# `norecursedirs` for pytest); leave it out of typecheck too.
exclude = ["**/__pycache__", ".venv", "alembic", "tests/legacy"]
reportUnusedImport = "error"
reportUnusedVariable = "warning"
reportMissingImports = "error"
# `_utcnow_naive` (app/utils/time.py) is the canonical naive-UTC helper and is
# intentionally consumed across `tests/`. The leading-underscore convention
# isn't enforced in this codebase — silence the rule globally so legitimate
# cross-module usage doesn't generate noise.
reportPrivateUsage = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-report=xml"
markers = [
  "integration: hits the test database",
  "rate_limit: requires a fresh in-memory limiter",
]
norecursedirs = ["tests/legacy", ".venv", "alembic"]
filterwarnings = [
  "ignore::DeprecationWarning:passlib.*",
  "ignore::DeprecationWarning:jose.*",
]
