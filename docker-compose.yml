# DEV ONLY. Production uses managed Postgres + Redis with rotated
# credentials per `backend-rules/security.md` rotation runbook.
# Ports bind to all interfaces because the dev workstation reaches this
# stack at the hive-server IP (192.168.1.14:5433); switch to 127.0.0.1
# bindings on a single-machine setup if you want to keep them off the LAN.
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for cache, sessions, queues). Password required even in dev so
  # local containers cannot accidentally be reachable without credentials.
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Meilisearch (storefront search). DEV ONLY — see header note. A master key
  # is required even in dev so the instance isn't open on the LAN; generate one
  # like REDIS_PASSWORD (`python -c 'import secrets; print(secrets.token_urlsafe(24))'`).
  # MEILI_HTTP_ADDR is set to 0.0.0.0 so the backend reaches it at the hive IP.
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: ecommerce_meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEILI_ENV: development
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      # The image is Alpine-based; busybox wget is available, curl is not.
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  meili_data:
